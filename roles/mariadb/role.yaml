description: MariaDB (MySQL-compatible) server with one database and user, reachable from the listed clients
families: [debian, rhel]
ports: [3306]
params:
  allow_from:
    default: ""
    description: >
      Hosts or segments allowed to connect (spec names; hosts become /32, segments their network).
      Remember the router policy must also allow the traffic.
  database:
    default: app
    description: Database to create (owned by 'user')
  user:
    default: app
    description: User to create; its random password is stored on the host in /root/.valor-mariadb-<user>
