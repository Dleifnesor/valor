# *zooms around* OwO roles/redis/role.yaml: metadata for redis, a key-value store; with allow_from, the host's
# firewall only lets those clients in ^w^
description: >
  Redis key-value store on the host's segment address (no password); with allow_from only those clients reach it -
  enforced by the host's firewall, so it also holds within the same segment
# Debian family only UwU
families: [debian]
# The served port comes from the `port` param >w<
ports_param: port
# params: all optional OwO
params:
  # port: the TCP port Redis listens on (default 6379) ^w^
  port:
    raw: true
    pattern: '^[0-9]{1,5}$'
    default: 6379
    description: TCP port Redis listens on
  # allow_from: hosts or segments that may connect (default anyone the router lets through) *wags tail*
  allow_from:
    default: ""
    description: >
      Hosts or segments allowed to connect (spec names; hosts become /32, segments their network); default anyone
      the router lets through. Clients in other segments also need a policy rule.
