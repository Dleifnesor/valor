# *collects everyone's diaries* OwO roles/syslog-server/role.yaml: metadata for syslog-server (rsyslog), which
# receives logs from range hosts and stores them per host ^w^
description: >
  Central log server (rsyslog) receiving syslog from range hosts on TCP and UDP 514, stored per host under
  /var/log/remote/<host>/ - pair with syslog-client on the other hosts (allow tcp/514 to it)
# Linux only UwU
families: [debian, rhel]
# Serves port 514 >w<
ports: [514]
# params: one optional setting OwO
params:
  # allow_from: hosts or segments that may send logs (default every private network) *nuzzles*
  allow_from:
    default: ""
    description: Hosts or segments that may send logs (default every private network)
