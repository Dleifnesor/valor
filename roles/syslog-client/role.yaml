# *whispers logs to a friend* OwO roles/syslog-client/role.yaml: metadata for syslog-client, which forwards this
# host's logs to the range's log server ^w^
description: >
  Forward this host's logs to the range's log server over TCP 514 (queued while the server is down) - pair with
  syslog-server; the policy must allow tcp/514 to it
# Linux only UwU
families: [debian, rhel]
# Serves nothing >w<
ports: []
# params: one required setting OwO
params:
  # server: the host with the syslog-server role *wags tail*
  server:
    required: true
    description: Host name of the log server (a host with the syslog-server role)
