# *keeps time for the whole pack* OwO roles/ntp-server/role.yaml: metadata for ntp-server (chrony), the range's
# time server, which keeps serving its own clock even without internet ^w^
description: >
  Time server (chrony) for the range: serves NTP on UDP 123 to range hosts, and keeps serving its own clock when the
  range has no internet - allow udp/123 to it in the policy; pair with ntp-client
# Linux only UwU
families: [debian, rhel]
# ports: [] because `ports` lists TCP only; NTP is UDP 123 (the script opens it in firewalld on Rocky/Alma) >w<
ports: []
# params: all optional OwO
params:
  # allow_from: hosts or segments that may ask for the time (default every private network) ^w^
  allow_from:
    default: ""
    description: Hosts or segments that may ask for the time (default every private network)
  # upstream: upstream NTP servers or pools, space separated, used as written *wags tail*
  upstream:
    default: ""
    description: Upstream NTP servers or pools, space separated (default pool.ntp.org)
    raw: true
    pattern: '^[A-Za-z0-9][A-Za-z0-9.-]{0,100}$'
