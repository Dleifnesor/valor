# *boops a shipping container* OwO roles/container/role.yaml: metadata for the container role, which runs ANY
# container image as a service (Docker on Debian/Ubuntu/Kali, Podman on Rocky/Alma) ^w^
description: >
  Any container image as a service - Docker on Debian/Ubuntu/Kali, Podman on Rocky/Alma - restarted on boot, e.g.
  image "redis:7" with publish "6379:6379"; images are pulled during the build (needs the build's internet access)
# Linux only UwU
families: [debian, rhel]
# ports_param: the ports it serves come from the `publish` param (the host side of each host:container pair) >w<
ports_param: publish
# params: the settings a spec can give this role OwO
params:
  # image (required): the image to run; the pattern only allows characters an image reference can have ^w^
  image:
    required: true
    raw: true
    pattern: '^[a-z0-9][a-z0-9._/:@-]{0,200}$'
    description: Image reference, e.g. nginx:1.27, ghcr.io/org/app:tag (images without a registry come from Docker Hub)
  # name: the container's name (default "app") UwU
  name:
    default: app
    raw: true
    pattern: '^[a-z0-9][a-z0-9_.-]{0,40}$'
    description: Container name
  # publish: host:container port pairs, optionally /tcp or /udp, space separated *wags tail*
  publish:
    default: ""
    raw: true
    pattern: '^[0-9]{1,5}:[0-9]{1,5}(/(tcp|udp))?$'
    description: Published ports as host:container, space separated (e.g. "8080:80")
  # env: KEY=VALUE environment settings, space separated (no spaces in values; never secrets!) >w<
  env:
    default: ""
    raw: true
    pattern: '^[A-Za-z_][A-Za-z0-9_]*=[^ ]*$'
    description: Environment as KEY=VALUE, space separated (values without spaces; never put secrets in a spec)
