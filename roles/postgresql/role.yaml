# *hugs the elephant* OwO roles/postgresql/role.yaml: metadata for postgresql, a PostgreSQL server reachable only
# from the listed clients ^w^
description: PostgreSQL server on the host's segment address, reachable only from the listed clients
# Linux only UwU
families: [debian, rhel]
# Serves port 5432 >w<
ports: [5432]
# params: all optional OwO
params:
  # allow_from: hosts or segments that may connect (names become addresses) ^w^
  allow_from:
    default: ""
    description: >
      Hosts or segments allowed to connect (spec names; hosts become /32, segments their network).
      Remember the router policy must also allow the traffic.
  # database: the database to create UwU
  database:
    raw: true
    pattern: '^[a-z_][a-z0-9_]{0,40}$'
    default: app
    description: Database to create (owned by 'user')
  # user: the login role to create; its random password is kept on the host in /root *nuzzles*
  user:
    raw: true
    pattern: '^[a-z_][a-z0-9_]{0,40}$'
    default: app
    description: Login role to create; its random password is stored on the host in /root/.valor-postgres-<user>
