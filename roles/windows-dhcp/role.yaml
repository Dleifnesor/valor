# *hands out Windows-flavored treats* OwO roles/windows-dhcp/role.yaml: metadata for windows-dhcp, the Windows
# Server DHCP role for its own segment ^w^
description: >
  DHCP server (Windows Server DHCP role) for its own segment - for extra clients; hands out the segment gateway and
  DNS servers. Serves without AD authorization (lab setting), also on domain members.
# Windows only UwU
families: [windows]
# ports: [] because it serves no TCP port (DHCP is UDP; the script enables its firewall rules) >w<
ports: []
# params: all optional OwO
params:
  # range_start: the first address to lease (default .100) ^w^
  range_start:
    default: ""
    description: First address to lease (default the network's .100)
  # range_end: the last address to lease (default .199) UwU
  range_end:
    default: ""
    description: Last address to lease (default the network's .199)
  # dns: DNS servers to hand out; host names become addresses *wags tail*
  dns:
    default: ""
    description: DNS servers to hand out, addresses or host names (default the host's own DNS servers, e.g. a DC)
  # lease_hours: how long a lease lasts, in hours >w<
  lease_hours:
    default: 8
    description: Lease duration in hours
