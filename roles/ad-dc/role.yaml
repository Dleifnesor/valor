description: Active Directory domain controller that creates a new forest (AD DS + DNS)
families: [windows]
ports: [53, 88, 135, 389, 445, 464, 636, 3268, 3269]
params:
  domain:
    required: true
    description: DNS name of the new domain, e.g. corp.lab
  netbios:
    description: NetBIOS name (default - the first label of the domain, upper case)
