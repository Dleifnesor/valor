# *dons a tiny Windows hard hat* OwO baselines/windows-l1.yaml: the default Windows HARDENING profile! VALOR loads it
# like the Linux ones, but valor/windows.py bundles the controls into ONE PowerShell script: each `check` runs as
# a script block (true = compliant), each failing one gets its `fix`, then it is checked again ^w^
# `id` is what specs and other profiles use; `title` is shown in the UI and reports UwU *wags tail*
id: windows-l1
title: Windows hardening baseline - Server 2022/2025, Windows 11 (aligned with common CIS Level 1 themes)
# Applied to Windows hosts of any range whose spec does not say `baseline: none`.
# Results are reported as "aligned with" these themes - never as a certified benchmark implementation.
# check: a PowerShell expression that is true when compliant; fix: idempotent PowerShell. $IsDC is set.
# "aligned with", never certified >w<
claim: aligned-with
# Windows hosts only OwO
families: [windows]
# shell: the snippets are PowerShell, not bash ^w^
shell: powershell
# *lines up the controls* the same fields as the Linux profiles: id, area, title, CIS theme, vendor reference,
# applies_to, check and fix UwU
controls:
  # *slams the old door shut* SMBv1 is ancient and was used by famous worms, so it's off >w<
  - id: smb1-disabled
    area: Network services
    title: SMBv1 server protocol disabled
    theme: CIS Level 1 - network protocols
    reference: "Microsoft Learn: Set-SmbServerConfiguration -EnableSMB1Protocol"
    applies_to: all
    # check: the SMB server's EnableSMB1Protocol is false OwO
    check: |
      -not (Get-SmbServerConfiguration).EnableSMB1Protocol
    # fix: turn it off (-Force skips the confirmation prompt) ^w^
    fix: |
      Set-SmbServerConfiguration -EnableSMB1Protocol $false -Force

  # *signs every letter* SMB messages must be signed, so they can't be tampered with in transit UwU
  - id: smb-signing-required
    area: Network services
    title: SMB server requires message signing
    theme: CIS Level 1 - network protocols
    reference: "Microsoft Learn: Set-SmbServerConfiguration -RequireSecuritySignature"
    applies_to: all
    # check: RequireSecuritySignature is on >w<
    check: |
      (Get-SmbServerConfiguration).RequireSecuritySignature
    # fix: require it OwO
    fix: |
      Set-SmbServerConfiguration -RequireSecuritySignature $true -Force

  # *puts up the fence* the Windows firewall is on for the domain, private and public profiles ^w^
  - id: firewall-enabled
    area: Firewall
    title: Windows Defender Firewall enabled for all profiles
    theme: CIS Level 1 - host firewall
    reference: "Microsoft Learn: Set-NetFirewallProfile"
    applies_to: all
    # check: no profile is disabled UwU
    check: |
      @(Get-NetFirewallProfile | Where-Object { -not $_.Enabled }).Count -eq 0
    # fix: enable all three >w<
    fix: |
      Set-NetFirewallProfile -All -Enabled True

  # *locks the guest room* the built-in Guest account is disabled OwO
  - id: guest-account-disabled
    area: Accounts
    title: Built-in Guest account disabled
    theme: CIS Level 1 - account policies
    reference: "Microsoft Learn: Disable-LocalUser; Active Directory Guest account"
    applies_to: all
    # check: on a domain controller the AD Guest account, elsewhere the local one, is not enabled ($IsDC is set by
    # the bundle) ^w^
    check: |
      if ($IsDC) { -not (Get-ADUser -Identity Guest -Properties Enabled).Enabled } else { -not (Get-LocalUser -Name Guest).Enabled }
    # fix: disable it in AD or locally UwU
    fix: |
      if ($IsDC) { Disable-ADAccount -Identity Guest } else { Disable-LocalUser -Name Guest }

  # *makes passwords longer* at least 14 characters >w<
  - id: password-min-length
    area: Accounts
    title: Minimum password length of 14 or more
    theme: CIS Level 1 - password policy
    reference: "Microsoft Learn: net accounts /minpwlen; Set-ADDefaultDomainPasswordPolicy -MinPasswordLength"
    applies_to: all
    # check: the domain policy on a DC, else the number in `net accounts` output OwO
    check: |
      if ($IsDC) { (Get-ADDefaultDomainPasswordPolicy).MinPasswordLength -ge 14 }
      else { [int]((net accounts | Select-String 'Minimum password length') -replace '\D', '') -ge 14 }
    # fix: set it on the domain (DC) or locally ^w^
    fix: |
      if ($IsDC) { Get-ADDomain | Set-ADDefaultDomainPasswordPolicy -MinPasswordLength 14 } else { net accounts /minpwlen:14 | Out-Null }

  # *muffles the shouting* LLMNR answers name lookups by shouting on the network, which attackers spoof to steal
  # password hashes, so it's off UwU
  - id: llmnr-disabled
    area: Network services
    title: LLMNR (multicast name resolution) disabled
    theme: CIS Level 1 - network protocols
    reference: "Microsoft Learn: DNS Client policy 'Turn off multicast name resolution' (EnableMulticast)"
    applies_to: all
    # check: the DNS client policy value EnableMulticast is 0 (a missing value throws, which counts as false) >w<
    check: |
      (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient' -Name EnableMulticast -ErrorAction Stop).EnableMulticast -eq 0
    # fix: create the policy key and set the value OwO
    fix: |
      New-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient' -Force | Out-Null
      New-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient' -Name EnableMulticast -Value 0 -PropertyType DWord -Force | Out-Null

  # *checks ID at the door* Remote Desktop must authenticate BEFORE showing a session (Network Level
  # Authentication) ^w^
  - id: rdp-nla-required
    area: Remote access
    title: Remote Desktop requires Network Level Authentication
    theme: CIS Level 1 - remote access
    reference: "Microsoft Learn: RDP-Tcp UserAuthentication registry value"
    applies_to: all
    # check: the RDP-Tcp UserAuthentication value is 1 UwU
    check: |
      (Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp').UserAuthentication -eq 1
    # fix: set it to 1 >w<
    fix: |
      Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 1

  # *writes down every visitor* logon successes and failures are audited OwO
  - id: audit-logon
    area: Auditing
    title: Logon events audited (success and failure)
    theme: CIS Level 1 - audit policy
    reference: "Microsoft Learn: auditpol /set /subcategory"
    applies_to: all
    # check: auditpol's CSV output for "Logon" says Success and Failure ^w^
    check: |
      ((auditpol /get /subcategory:"Logon" /r | ConvertFrom-Csv).'Inclusion Setting') -eq 'Success and Failure'
    # fix: enable both UwU
    fix: |
      auditpol /set /subcategory:"Logon" /success:enable /failure:enable | Out-Null

  # *hires a guard dog* Microsoft Defender real-time protection is on >w<
  - id: defender-realtime
    area: Malware protection
    title: Microsoft Defender real-time protection on
    theme: CIS Level 1 - malware defenses
    reference: "Microsoft Learn: Set-MpPreference -DisableRealtimeMonitoring"
    applies_to: all
    # check: real-time protection is enabled OwO
    check: |
      (Get-MpComputerStatus).RealTimeProtectionEnabled
    # fix: turn real-time monitoring back on ^w^
    fix: |
      Set-MpPreference -DisableRealtimeMonitoring $false
