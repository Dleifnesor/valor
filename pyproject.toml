[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valor"
version = "0.2.0.dev0"
description = "V.A.L.O.R. - declarative, verified test ranges on Proxmox VE, with a secure web UI"
requires-python = ">=3.11"
dependencies = ["proxmoxer>=2.0", "requests>=2.31", "pydantic>=2.6", "PyYAML>=6.0"]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.30", "argon2-cffi>=23.1", "cryptography>=42", "segno>=1.6", "ldap3>=2.9"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
valor = "valor.cli:main"
valor-mcp = "valor.mcp_server:main"
valor-admin = "valor.admin:main"
valor-web = "valor.web.cli:main"

[tool.setuptools]
packages = ["valor", "valor.web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
