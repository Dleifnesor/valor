[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valor"
version = "0.1.0"
description = "V.A.L.O.R. - declarative, verified test ranges on Proxmox VE, operated through Claude Code"
requires-python = ">=3.11"
dependencies = ["proxmoxer>=2.0", "requests>=2.31", "pydantic>=2.6", "PyYAML>=6.0", "mcp>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
valor = "valor.cli:main"
valor-mcp = "valor.mcp_server:main"
valor-admin = "valor.admin:main"

[tool.setuptools]
packages = ["valor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
