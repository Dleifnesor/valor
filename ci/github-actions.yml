# Example pipeline: build a disposable range, verify it, always tear it down.
# Copy to .github/workflows/valor-range.yml in the repository that holds your range specs (in ranges/).
#
# Requirements
# - A self-hosted runner inside the VALOR VM (label "valor") running as the `valor` user, the account the engine
#   runs as: it alone can read the Proxmox API token, so treat the runner like an administrator.
# - Convention: the spec file name equals the range name (ranges/web2tier.yaml -> range "web2tier").
# Non-zero exit codes fail the job: 1 invalid spec, 2 build failed, 3 verification failed, 4 engine busy.
name: valor-range

on:
  workflow_dispatch:
    inputs:
      range:
        description: Range spec name (without .yaml)
        default: web2tier
  push:
    paths: ["ranges/**"]

concurrency: valor-engine          # the engine runs one infrastructure job at a time anyway

jobs:
  range:
    runs-on: [self-hosted, valor]
    env:
      RANGE: ${{ inputs.range || 'web2tier' }}
      VALOR: /opt/valor/bin/valor
    steps:
      - uses: actions/checkout@v4

      - name: Publish the specs to VALOR (ranges made in the web UI stay)
        run: cp ranges/*.yaml /var/lib/valor/data/ranges/

      - name: Validate
        run: $VALOR validate "$RANGE.yaml"

      - name: Plan
        run: $VALOR plan "$RANGE.yaml"

      - name: Apply and verify
        run: $VALOR apply "$RANGE.yaml" --verify

      - name: Your tests against the range go here
        run: echo "e.g. run integration tests through a role-provisioned test runner host"

      - name: Journal
        if: always()
        run: cat "/var/lib/valor/data/journals/$RANGE.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Destroy
        if: always()
        run: $VALOR destroy "$RANGE" --yes
