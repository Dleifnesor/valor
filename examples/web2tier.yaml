# *builds a classic two-tier web lab* OwO examples/web2tier.yaml: the reference range! ^w^
# A DMZ web server with internet access, and an isolated LAN database only the web server may reach on TCP 5432
# *wags tail*
apiVersion: valor/v1
name: web2tier
description: >
  Reference range 1 (MVP spec 6.1): a DMZ with an nginx web server that has internet access,
  and an isolated LAN running PostgreSQL that only the web server can reach, on TCP 5432.
# The hardening profile for every Linux host UwU
baseline: ubuntu-l1

# Two segments: the DMZ (internet allowed) and the LAN (no internet) >w<
segments:
  - name: dmz
    vlan: 110
    cidr: 10.110.0.0/24
    internet: true
  - name: lan
    vlan: 120
    cidr: 10.120.0.0/24
    internet: false

# The web server (nginx) in the DMZ and the database (PostgreSQL, 2 GiB) in the LAN; the database accepts the web
# server OwO
hosts:
  - name: web
    segment: dmz
    address: 10.110.0.10
    roles:
      - name: nginx
  - name: db
    segment: lan
    address: 10.120.0.10
    memory: 2048
    roles:
      - name: postgresql
        params:
          allow_from: [web]

# The ONE allowed flow between segments: DMZ -> LAN on TCP 5432. Everything else is blocked ^w^
policy:
  - from: dmz
    to: lan
    proto: tcp
    ports: [5432]
    description: web tier to database

# Tests: the allowed flow is open; SSH from web to db and anything from db to web are closed UwU
tests:
  - {name: web reaches db on 5432, from: web, to: db, proto: tcp, port: 5432, expect: open}
  - {name: web cannot reach db on SSH, from: web, to: db, proto: tcp, port: 22, expect: closed}
  - {name: db cannot reach web, from: db, to: web, proto: tcp, port: 80, expect: closed}
