# *puts a little helmet on every response* OwO appliance/nginx-headers.conf: the SECURITY HEADERS! ^w^
# Included in every nginx location (nginx doesn't inherit add_header into locations that set their own). "always"
# adds them to error pages too *wags tail*
# Security headers for every VALOR response (included in each location: nginx does not inherit add_header).
# HSTS: browsers use HTTPS for this site for a year UwU
add_header Strict-Transport-Security "max-age=31536000" always;
# CSP: only VALOR's own scripts, styles (inline styles allowed for React), images (and data: URLs for QR codes) and
# API; no framing, no plugins, forms only to VALOR >w<
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
# No content-type guessing, no framing, no referrer, own browsing context and resources, and no camera, microphone,
# location or USB OwO
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=()" always;
