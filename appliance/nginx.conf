# VALOR web UI (managed by the VALOR installer; changes are overwritten on upgrade).
# TLS terminates here; the API runs on a unix socket; the built UI is static.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    # The CA certificate is public: allow fetching it before the browser trusts the HTTPS certificate.
    location = /ca.crt {
        root /opt/valor/web;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="valor-ca.crt"';
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate /etc/valor/tls/server.crt;
    ssl_certificate_key /etc/valor/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:VALOR:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;
    root /opt/valor/web;
    include /etc/nginx/snippets/valor-headers.conf;

    location /api/ {
        # nginx is the single source of security headers: drop the app's copies (it sets them for development).
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Permissions-Policy;
        include /etc/nginx/snippets/valor-headers.conf;
        proxy_pass http://unix:/run/valor-web/web.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # ISO uploads: multi-GB request bodies streamed straight to the API (not buffered by nginx)
    location = /api/isos/upload {
        include /etc/nginx/snippets/valor-headers.conf;
        client_max_body_size 20g;
        proxy_request_buffering off;
        proxy_pass http://unix:/run/valor-web/web.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 2h;
        proxy_send_timeout 2h;
    }

    # Browser consoles: websocket relay to the VM consoles (long-lived)
    location /api/console/ {
        include /etc/nginx/snippets/valor-headers.conf;
        proxy_pass http://unix:/run/valor-web/web.sock;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 8h;
        proxy_send_timeout 8h;
        proxy_buffering off;
    }

    location /assets/ {
        include /etc/nginx/snippets/valor-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /ca.crt {
        include /etc/nginx/snippets/valor-headers.conf;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="valor-ca.crt"' always;
    }

    location / {
        include /etc/nginx/snippets/valor-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
