#!/usr/sbin/nft -f
# *builds a tiny wall around the VALOR VM* OwO appliance/nftables.conf: the VALOR VM's FIREWALL! ^w^
# setup.sh fills in the two address placeholders below (the allowed networks) and loads it. Everything is DENIED by
# default *wags tail*
# VALOR VM firewall (managed by the VALOR installer). Default deny: the web UI only for the LAN/VPN networks
# chosen at install, SSH (keys only) only from the Proxmox nodes, nothing is forwarded.
flush ruleset

# Two address sets: who may open the web UI, and who may SSH in (the Proxmox nodes). "interval" allows whole networks;
# "auto-merge" merges overlapping ones UwU
table inet valor_fw {
  set web_allowed {
    type ipv4_addr
    flags interval
    auto-merge
    elements = { @WEB_ALLOWED@ }
  }
  set ssh_allowed {
    type ipv4_addr
    flags interval
    auto-merge
    elements = { @SSH_ALLOWED@ }
  }

  # Incoming: drop by default; allow loopback, replies, rate-limited useful ICMP, IPv6 neighbour discovery, DHCP client
  # answers, the web UI from the allowed networks, and SSH from the Proxmox nodes >w<
  chain input {
    type filter hook input priority filter; policy drop;
    iif "lo" accept
    ct state established,related accept
    ct state invalid drop
    meta l4proto icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } limit rate 20/second accept
    meta l4proto ipv6-icmp accept comment "neighbour discovery"
    udp dport 68 accept comment "DHCP client"
    udp dport 546 accept comment "DHCPv6 client"
    ip saddr @web_allowed tcp dport { 80, 443 } accept comment "web UI (LAN and VPN only)"
    ip saddr @ssh_allowed tcp dport 22 accept comment "break-glass SSH from the Proxmox nodes"
  }

  # Nothing is forwarded through this VM OwO
  chain forward {
    type filter hook forward priority filter; policy drop;
  }

  # Outgoing: allowed (packages, the Proxmox API, AI providers, notifications) ^w^
  chain output {
    type filter hook output priority filter; policy accept;
  }
}
