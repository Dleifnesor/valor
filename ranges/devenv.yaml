apiVersion: valor/v1
name: devenv
description: >
  Reference range 3: single-segment development environment with internet access - a Debian 13 developer
  workstation and an Ubuntu PostgreSQL server for it.
baseline: ubuntu-l1

segments:
  - {name: dev, vlan: 310, cidr: 10.31.0.0/24, internet: true}

hosts:
  - name: devbox
    segment: dev
    address: 10.31.0.10
    os: debian-13
    cores: 2
    memory: 2048
    disk: 20
    roles:
      - name: dev-tools
  - name: devdb
    segment: dev
    address: 10.31.0.20
    roles:
      - name: postgresql
        params:
          allow_from: [devbox]

tests:
  - {name: workstation reaches the database, from: devbox, to: devdb, port: 5432, expect: open}
  - {name: workstation has internet, from: devbox, to: internet, expect: open}
