# VALOR operating-system catalog.
#
# Each entry is an official cloud image that the installer (or `valor-admin template build <os>`) turns into a
# Proxmox template with the QEMU guest agent baked in. Templates are found by their tags
# (`valor-template` + `os-<name with dots as dashes>`) in VALOR's template pool, never by a fixed VMID, so they
# can live wherever the cluster has room. Range hosts pick an OS with `os:`; hosts without `os:` use the
# engine default (ubuntu-24.04).
#
# family: roles and baselines are written for the 'debian' family (apt) for now.
# Checksum lists are verified against the signing key shipped in templates/keys/ (fingerprint checked too).

["ubuntu-24.04"]
family = "debian"
description = "Ubuntu 24.04 LTS (Noble Numbat), official cloud image"
image_url = "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-amd64.img"
checksums_url = "https://cloud-images.ubuntu.com/releases/noble/release/SHA256SUMS"
checksums_sig_url = "https://cloud-images.ubuntu.com/releases/noble/release/SHA256SUMS.gpg"
checksum_type = "sha256"
signing_key_file = "keys/ubuntu-cloud-images.asc"
signing_key_fingerprint = "D2EB44626FDDC30B513D5BB71A5D6C4C7DB87C81"   # UEC Image Automatic Signing Key

["ubuntu-26.04"]
family = "debian"
description = "Ubuntu 26.04 LTS (Resolute Raccoon), official cloud image"
image_url = "https://cloud-images.ubuntu.com/releases/resolute/release/ubuntu-26.04-server-cloudimg-amd64.img"
checksums_url = "https://cloud-images.ubuntu.com/releases/resolute/release/SHA256SUMS"
checksums_sig_url = "https://cloud-images.ubuntu.com/releases/resolute/release/SHA256SUMS.gpg"
checksum_type = "sha256"
signing_key_file = "keys/ubuntu-cloud-images.asc"
signing_key_fingerprint = "D2EB44626FDDC30B513D5BB71A5D6C4C7DB87C81"

["debian-13"]
family = "debian"
description = "Debian 13 (trixie), official generic cloud image"
image_url = "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
checksums_url = "https://cloud.debian.org/images/cloud/trixie/latest/SHA512SUMS"
checksum_type = "sha512"

["debian-12"]
family = "debian"
description = "Debian 12 (bookworm), official generic cloud image"
image_url = "https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2"
checksums_url = "https://cloud.debian.org/images/cloud/bookworm/latest/SHA512SUMS"
checksum_type = "sha512"

["rocky-10"]
family = "rhel"
description = "Rocky Linux 10, official GenericCloud image"
cpu_min = "x86-64-v3"              # RHEL 10 family needs AVX2-class CPUs
install_iso = "rocky-10-minimal"   # `install: iso` hosts: kickstart install from this ISO catalog entry
image_url = "https://download.rockylinux.org/pub/rocky/10/images/x86_64/Rocky-10-GenericCloud-Base.latest.x86_64.qcow2"
checksums_url = "https://download.rockylinux.org/pub/rocky/10/images/x86_64/CHECKSUM"
checksum_type = "sha256"

["alma-10"]
family = "rhel"
description = "AlmaLinux 10, official GenericCloud image"
cpu_min = "x86-64-v3"
install_iso = "alma-10-minimal"
image_url = "https://repo.almalinux.org/almalinux/10/cloud/x86_64/images/AlmaLinux-10-GenericCloud-latest.x86_64.qcow2"
checksums_url = "https://repo.almalinux.org/almalinux/10/cloud/x86_64/images/CHECKSUM"
checksum_type = "sha256"

["kali"]
family = "debian"
description = "Kali Linux (rolling), official generic cloud image"
checksums_url = "https://kali.download/cloud-images/current/SHA256SUMS"
checksum_type = "sha256"
image_base = "https://kali.download/cloud-images/current/"
image_pattern = 'kali-linux-\d+\.\d+[a-z]?-cloud-genericcloud-amd64\.tar\.xz'
archive = "tar.xz"                 # contains a raw disk image

# Windows: built from installer ISOs in the ISO library (unattended setup + VirtIO guest tools + sysprep).
# `iso` names an ISO catalog entry (templates/isos.toml); `edition` is a pattern for the image name in install.wim.
["windows-server-2025"]
family = "windows"
description = "Windows Server 2025 Datacenter (Desktop Experience), evaluation"
iso = "windows-server-2025-eval"
edition = 'DATACENTER$'
default_memory = 4096
default_disk = 64

["windows-server-2025-core"]
family = "windows"
description = "Windows Server 2025 Datacenter Server Core, evaluation"
iso = "windows-server-2025-eval"
edition = 'DATACENTERCORE$'
default_memory = 2048
default_disk = 64

