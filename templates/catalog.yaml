# VALOR operating-system catalog.
# Each entry is a Linux cloud image that `valor-admin template build <os>` turns into a
# Proxmox template (qemu-guest-agent baked in). Range hosts pick one with `os:`; hosts
# without `os:` use the engine default (ubuntu-24.04).
# family: roles and baselines are written for the 'debian' family (apt) in the MVP.

ubuntu-24.04:
  vmid: 9000
  family: debian
  description: Ubuntu 24.04 LTS (Noble Numbat), official cloud image
  image_url: https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-amd64.img
  checksums_url: https://cloud-images.ubuntu.com/releases/noble/release/SHA256SUMS
  checksums_sig_url: https://cloud-images.ubuntu.com/releases/noble/release/SHA256SUMS.gpg
  checksum_type: sha256
  signing_key_fingerprint: D2EB44626FDDC30B513D5BB71A5D6C4C7DB87C81   # UEC Image Automatic Signing Key <cdimage@ubuntu.com>

